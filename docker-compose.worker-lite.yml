# worker-lite as a compose service next to the stock Fluxer stack.
#
# Two things differ from the api service and both matter:
#
#   * it must NOT run while the api's embedded worker runs — same subjects, same
#     workqueue stream, and NATS refuses two consumers with overlapping filters.
#     Set FLUXER_API_EMBEDDED_WORKER=false on the api service.
#   * it needs the same database, cache, object storage and (for URL signing) the
#     media secrets, because it writes the rows the api reads.
#
# Secrets come from the stack's .env, exactly as the api service reads them. Nothing
# here needs a new secret of its own.

services:
  worker-lite:
    image: ${WORKER_LITE_IMAGE:-fluxer-worker-lite:latest}
    # Or build locally:  build: .
    restart: "no"          # a worker that died must look dead in `docker ps`
    networks: [fluxer]
    ports:
      - "127.0.0.1:9099:9099"   # /status; keep it on the loopback
    environment:
      NATS_URL: nats://nats:4222
      STREAM: JOBS
      JOB_PREFIX: jobs.
      DLQ_STREAM: JOBS_DLQ
      DLQ_PREFIX: dlq.
      PARK_STREAM: JOBS_PARKED
      PARK_PREFIX: parked.
      PGHOST: ${FLUXER_POSTGRES_HOST}
      PGPORT: ${FLUXER_POSTGRES_PORT}
      PGDATABASE: ${FLUXER_POSTGRES_DATABASE}
      PGUSER: ${FLUXER_POSTGRES_USERNAME}
      PGPASSWORD: ${FLUXER_POSTGRES_PASSWORD}
      VALKEY_ADDR: valkey:6379
      VALKEY_PASSWORD: ${FLUXER_KV_PASSWORD:-}
      FLUXER_S3_ENDPOINT: ${FLUXER_S3_ENDPOINT}
      FLUXER_S3_BUCKET_CDN: ${FLUXER_S3_BUCKET_CDN}
      FLUXER_S3_BUCKET_HARVESTS: ${FLUXER_S3_BUCKET_HARVESTS}
      FLUXER_S3_ACCESS_KEY_ID: ${FLUXER_S3_ACCESS_KEY_ID}
      FLUXER_S3_SECRET_ACCESS_KEY: ${FLUXER_S3_SECRET_ACCESS_KEY}
      FLUXER_S3_REGION: ${FLUXER_S3_REGION:-us-east-1}
      FLUXER_MEDIA_ENDPOINT: ${FLUXER_MEDIA_ENDPOINT}
      FLUXER_MEDIA_PROXY_SECRET_KEY: ${FLUXER_MEDIA_PROXY_SECRET_KEY}
      FLUXER_ATTACHMENT_URL_SECRET: ${FLUXER_ATTACHMENT_URL_SECRET}
      FLUXER_BASE_DOMAIN: ${FLUXER_BASE_DOMAIN}
      FLUXER_INSTANCE_NAME: ${FLUXER_APP_PRODUCT_NAME:-Fluxer}
      STATUS_ADDR: ":9099"
      STATS_SEC: "30"
      MAX_RSS_MB: "96"
      LOG_TASKS: "0"
    # No healthcheck in the container: the image carries only the binary (no shell, no
    # curl). Probe http://127.0.0.1:9099/status from the host or your monitor instead —
    # it answers with the api identity, counters and lane state.

networks:
  fluxer:
    external: true
    name: ${FLUXER_NETWORK:-fluxer_fluxer}
