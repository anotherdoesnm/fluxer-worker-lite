name: e2e

# Настоящий прогон цепочки, которую не покрывает ни один юнит-тест: бот удаляет
# свои сообщения → api дебаунсит серию в задачу batchGuildAuditLogMessageDeletes →
# worker склеивает удаления → в аудит-логе появляется MESSAGE_BULK_DELETE (73)
# с options {channel_id, count}.
#
# Ночью и по кнопке, не на каждый push: это живой инстанс, каждый прогон оставляет
# запись в аудит-логе и занимает единственный слот раннера.
#
# Секрет FLUXER_BOT_TOKEN — токен бота в гильдии FLUXER_E2E_GUILD (по умолчанию
# «1GB RAM Fluxer Testing»), с правами на каналы, сообщения и аудит-лог. Секрет
# видит только этот джоб.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

jobs:
  batch-audit:
    runs-on: warden
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: бот удаляет сообщения, worker обязан их склеить
        env:
          FLUXER_BOT_TOKEN: ${{ secrets.FLUXER_BOT_TOKEN }}
        run: |
          set -eo pipefail
          mkdir -p /srv/ci/ci-logs /srv/ci/go-cache/mod /srv/ci/go-cache/build
          log=/srv/ci/ci-logs/worker-lite-e2e.log
          if [ -z "$FLUXER_BOT_TOKEN" ]; then
            echo "ОШИБКА: секрет FLUXER_BOT_TOKEN не задан" >&2
            exit 1
          fi
          podman run --rm --network=host \
            -v "$PWD":/src:z -w /src \
            -v /srv/ci/go-cache/mod:/gomod:z \
            -v /srv/ci/go-cache/build:/gocache:z \
            -e GOMODCACHE=/gomod -e GOCACHE=/gocache -e GOFLAGS=-mod=mod \
            -e FLUXER_BOT_TOKEN="$FLUXER_BOT_TOKEN" \
            docker.io/library/golang:1.24-alpine go run ./cmd/e2e 2>&1 | tee "$log"
