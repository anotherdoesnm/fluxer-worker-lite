name: e2e

# Настоящий прогон цепочки, которую не покрывает ни один юнит-тест: бот удаляет
# свои сообщения → api дебаунсит серию в задачу batchGuildAuditLogMessageDeletes →
# worker склеивает удаления → в аудит-логе появляется MESSAGE_BULK_DELETE (73)
# с options {channel_id, count}.
#
# Ночью и по кнопке, не на каждый push: это живой инстанс, каждый прогон
# оставляет запись в аудит-логе.
#
# Секрет FLUXER_BOT_TOKEN — токен бота в гильдии FLUXER_E2E_GUILD (по умолчанию
# «1GB RAM Fluxer Testing»), с правами на каналы, сообщения и аудит-лог.
#
# 2026-11-05: раньше джоба запускала `go run` внутри golang:1.24-alpine через
# podman на домашнем раннере. На GitHub-hosted раннере podman не нужен: ставим
# Go и запускаем ту же команду прямо на хосте джобы.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

jobs:
  # The instance is a 1 GiB LXC with onboot: 0, so it is asleep most nights and the
  # nightly run used to fail with HTTP 502 from the tunnel. Failing on purpose when
  # nobody is home is noise, not signal: probe first, and only run the scenario when
  # the api actually answers. A 5xx or a dead connection means "down"; any 2xx-4xx
  # means "the server is up" (an unauthenticated /users/@me answers 401).
  preflight:
    runs-on: ubuntu-latest
    outputs:
      up: ${{ steps.probe.outputs.up }}
    steps:
      - id: probe
        name: is the instance awake?
        run: |
          set -eo pipefail
          url="${FLUXER_BASE_URL:-https://fluxer.doesnmlab.xyz}/api/v1/users/@me"
          code=$(curl -s -o /dev/null -m 15 -w '%{http_code}' "$url" || echo 000)
          case "$code" in
            2??|3??|4??)
              echo "up=true" >> "$GITHUB_OUTPUT"
              echo "instance answers with $code"
              ;;
            *)
              echo "up=false" >> "$GITHUB_OUTPUT"
              echo "::notice::instance is down ($code) - skipping e2e; start fluxer-test and run this workflow manually"
              ;;
          esac

  batch-audit:
    needs: preflight
    if: needs.preflight.outputs.up == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: бот удаляет сообщения, worker обязан их склеить
        env:
          FLUXER_BOT_TOKEN: ${{ secrets.FLUXER_BOT_TOKEN }}
        run: |
          set -eo pipefail
          if [ -z "${FLUXER_BOT_TOKEN:-}" ]; then
            echo "ОШИБКА: секрет FLUXER_BOT_TOKEN не задан" >&2
            exit 1
          fi
          go run ./cmd/e2e
